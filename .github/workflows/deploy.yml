name: Deploy

on:
  push:
    branches:
      - main

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: margot-production
      cancel-in-progress: false

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/var/www/app

            echo "Utilizador: $(whoami)"
            echo "Diretório inicial: $(pwd)"
            ls -ld "$APP_DIR" "$APP_DIR/.git"

            test -d "$APP_DIR/.git" || {
              echo "ERRO: $APP_DIR não é um repositório Git acessível."
              exit 1
            }

            git config --global --add safe.directory "$APP_DIR"

            FETCH_OK=0

            for tentativa in 1 2 3 4 5; do
              echo "Fetch do GitHub: tentativa $tentativa de 5"

              if GIT_TERMINAL_PROMPT=0 git -C "$APP_DIR" -c http.version=HTTP/1.1 fetch --prune origin main; then
                FETCH_OK=1
                break
              fi

              if [ "$tentativa" -lt 5 ]; then
                espera=$((tentativa * 5))
                echo "Fetch falhou. Nova tentativa em ${espera}s..."
                sleep "$espera"
              fi
            done

            if [ "$FETCH_OK" -ne 1 ]; then
              echo "ERRO: não foi possível obter a branch main do GitHub após 5 tentativas."
              exit 1
            fi

            if [ "$(git -C "$APP_DIR" rev-parse origin/main)" != '${{ github.sha }}' ]; then
              echo "Publicação cancelada: main avançou; aguardar os testes da nova revisão."
              exit 1
            fi

            # Consultar a estrutura da base de dados antes de publicar.
            # Este script não altera dados nem aplica migrações.
            PREFLIGHT_FILE=$(mktemp)
            trap 'rm -f "$PREFLIGHT_FILE"' EXIT

            git -C "$APP_DIR" show origin/main:database/check-location-state.php > "$PREFLIGHT_FILE"

            # Usar a identidade dos serviços da aplicação.
            # A configuração mantém as permissões atuais.
            # O script entra por stdin; o temporário permanece privado.
            sudo -n -u www-data /usr/bin/env APP_ROOT="$APP_DIR" \
              /usr/bin/php /dev/stdin < "$PREFLIGHT_FILE"

            rm -f "$PREFLIGHT_FILE"
            trap - EXIT

            git -C "$APP_DIR" reset --hard origin/main

            cd "$APP_DIR"

            composer install --no-dev --optimize-autoloader

            php -l websocket-server.php
            php -l push-worker.php
            php -l location-recovery-worker.php

            sudo install -m 0644 \
              deploy/app-push.service \
              /etc/systemd/system/app-push.service

            sudo install -m 0644 deploy/app-location-recovery.service /etc/systemd/system/app-location-recovery.service

            sudo install -m 0644 deploy/app-push-worker@.service /etc/systemd/system/app-push-worker@.service

            sudo systemctl daemon-reload
            sudo systemctl enable app-push app-location-recovery
            sudo systemctl restart app-websocket
            sudo systemctl restart app-push app-location-recovery
            sudo systemctl reload apache2

            DEPLOYED_SHA=$(git -C "$APP_DIR" rev-parse HEAD)
            test "$DEPLOYED_SHA" = '${{ github.sha }}'

            echo "PUBLICAÇÃO CONCLUÍDA: $DEPLOYED_SHA"