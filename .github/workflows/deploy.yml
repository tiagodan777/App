name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/var/www/app

            echo "Utilizador: $(whoami)"
            echo "Diretório inicial: $(pwd)"
            ls -ld "$APP_DIR" "$APP_DIR/.git"

            test -d "$APP_DIR/.git" || {
              echo "ERRO: $APP_DIR não é um repositório Git acessível."
              exit 1
            }

            git config --global --add safe.directory "$APP_DIR"
            git -C "$APP_DIR" fetch --prune origin main
            git -C "$APP_DIR" reset --hard origin/main

            cd "$APP_DIR"

            composer install --no-dev --optimize-autoloader

            php -l websocket-server.php
            php -l push-worker.php

            sudo install -m 0644 \
              deploy/app-push.service \
              /etc/systemd/system/app-push.service
            sudo systemctl daemon-reload
            sudo systemctl enable app-push
            sudo systemctl restart app-websocket
            sudo systemctl restart app-push
            sudo systemctl reload apache2