<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Margot</title>
</head>
<body>
    <main>
        <h1>Margot</h1>
        <p id="opening">A abrir a aplicação…</p>
    </main>
    <script>
        (function () {
            var preference = navigator.language || (navigator.languages || [])[0] || '';
            var portuguese = /^pt(?:[-_]|$)/i.test(preference.trim());
            document.documentElement.lang = portuguese ? 'pt-PT' : 'en';
            if (!portuguese) document.getElementById('opening').textContent = 'Opening the app…';
        })();
    </script>
</body>
</html>
