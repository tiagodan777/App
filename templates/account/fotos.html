<div id="fotos">
    <div id="perfil-camera-interface" aria-hidden="true">
        <video id="perfil-camera-video" autoplay playsinline muted></video>

        <canvas id="perfil-camera-canvas"></canvas>

        <div class="perfil-camera-header">
            <button type="button" id="perfil-fechar-camera" class="perfil-camera-icon" aria-label="Fechar câmara">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <button type="button" id="perfil-trocar-camera" class="perfil-camera-icon" aria-label="Trocar câmara">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
                    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </div>

        <div class="perfil-camera-guia">
            <div class="perfil-camera-circulo"></div>

            <p>Enquadra o teu rosto dentro do círculo</p>
        </div>

        <div class="perfil-camera-footer">
            <button type="button" id="perfil-abrir-galeria-camera" class="perfil-galeria-botao" aria-label="Abrir galeria">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>

                    <circle cx="8.5" cy="8.5" r="1.5"></circle>

                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>

            <button type="button" id="perfil-capturar-foto" class="perfil-disparador" aria-label="Tirar fotografia">
                <span></span>
            </button>

            <div class="perfil-camera-espaco"></div>
        </div>
    </div>

    <div id="perfil-fotos-conteudo">
        <h1>{{ modo_edicao ? 'Atualiza as tuas fotografias' : 'Mostra quem és' }}</h1>

        <p class="perfil-fotos-explicacao">Adiciona até 6 fotografias. A primeira será a tua foto principal.</p>

        <input
            type="file"
            name="imagens[]"
            id="perfil-input-fotos"
            accept="image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif"
            multiple
            hidden
        >

        <div id="perfil-lista-fotos"></div>

        <div class="perfil-fotos-acoes">
            <button type="button" id="perfil-tirar-foto" class="perfil-botao-foto">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1 2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>

                    <circle cx="12" cy="13" r="4"></circle>
                </svg>

                Tirar foto
            </button>

            <button type="button" id="perfil-escolher-fotos" class="perfil-botao-foto">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>

                    <circle cx="8.5" cy="8.5" r="1.5"></circle>

                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>

                Escolher fotos
            </button>
        </div>

        <p id="perfil-fotos-erro" aria-live="polite"></p>

        <nav class="anterior-proximo">
            {% if modo_edicao %}
                <a data-etapa="#editar-perfil" data-sem-validar="true" class="anterior">
                    Voltar à lista
                </a>

                <button type="submit" class="proximo guardar-secao">Guardar e sair</button>
            {% else %}
                <a data-etapa="#descricao" class="anterior">
                    Anterior
                </a>

                <a data-etapa="#permissoes" class="proximo">
                    Próximo
                </a>
            {% endif %}
        </nav>
    </div>
</div>
