<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="robots" content="noindex,nofollow">
    <title>Reenviar confirmação | Margot</title>
    <link rel="stylesheet" href="{{ doc_root }}estilos/style.css">
    <link rel="stylesheet" href="{{ doc_root }}estilos/login.css">
</head>
<body>
    <main>
        <form action="{{ doc_root }}email-verification-resend" method="post">
            <input type="hidden" name="_csrf" value="{{ csrf_token|e('html_attr') }}">
            <h1>Confirmar email</h1>
            {% if enviado %}
                <p role="status" aria-live="polite">
                    Se existir uma conta por confirmar associada a esse email, receberás uma nova ligação.
                </p>
            {% else %}
                <p>Escreve o email usado para criar a tua conta.</p>
                {% if mensagem_erro %}
                    <p id="verification-resend-error" role="alert" aria-live="assertive">
                        {{ mensagem_erro|e }}
                    </p>
                {% endif %}
                <p>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" value="{{ email|e('html_attr') }}" autocomplete="email" {% if mensagem_erro %}aria-describedby="verification-resend-error" aria-invalid="true"{% endif %} required>
                </p>
                <input type="submit" value="Enviar ligação">
            {% endif %}
        </form>
    </main>
    <aside>
        <a href="{{ doc_root }}login" id="esqueci-palavra-passe">Voltar ao login</a>
    </aside>
    <script src="{{ doc_root }}js/navegacao-documento.js?v=1"></script>
</body>
</html>
