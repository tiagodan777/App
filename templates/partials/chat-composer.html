    <form
        id="chat-form"
        class="chat-form"
        action="{{ doc_root }}messages/{{ outro.id }}"
        method="post"
        enctype="multipart/form-data"
    >
        <input type="hidden" name="action" value="send">
        <input type="hidden" name="profile_access_token" id="chat-profile-access-token" value="">

        <div id="chat-reply-preview" class="chat-reply-preview" hidden>
            <div>
                <small>A responder</small>
                <span></span>
            </div>
            <button type="button" id="chat-reply-cancel" aria-label="Cancelar resposta">×</button>
        </div>

        <div id="chat-media-preview" class="chat-media-preview" hidden></div>

        <input type="checkbox" id="chat-view-once" hidden>

        <div class="chat-compositor">
            <button type="button" id="chat-camera-open" class="chat-icon" aria-label="Tirar fotografia">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h4l2-3h4l2 3h4v14H4z"></path>
                    <circle cx="12" cy="12" r="4"></circle>
                </svg>
            </button>

            <input type="file" id="chat-gallery" accept="image/*" multiple hidden>
            <input type="file" id="chat-media" name="media" accept="image/*,video/*" hidden>

            <textarea
                id="chat-texto"
                name="mensagem"
                rows="1"
                maxlength="2000"
                placeholder="Mensagem…"
                aria-label="Mensagem"
                autocomplete="off"
                autocapitalize="sentences"
                spellcheck="true"
                enterkeyhint="send"
            ></textarea>

            <button type="button" id="chat-gallery-open" class="chat-icon" aria-label="Escolher fotografias da galeria">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                    <circle cx="8" cy="8" r="1.5"></circle>
                    <path d="M3 17l6-6 4 4 3-3 5 5"></path>
                </svg>
            </button>

            <button type="button" id="chat-microphone" class="chat-icon" aria-label="Gravar mensagem de voz">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="13" rx="3"></rect>
                    <path d="M5 10v2a7 7 0 0014 0v-2M12 19v3M8 22h8"></path>
                </svg>
            </button>

            <div id="chat-recording" class="chat-recording" hidden>
                <button type="button" id="chat-recording-cancel" aria-label="Apagar gravação">×</button>
                <span class="chat-recording-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                <output id="chat-recording-time" aria-live="off">0:00</output>
                <button type="button" id="chat-recording-send" aria-label="Enviar gravação">Enviar</button>
            </div>

            <button type="submit" id="chat-enviar" aria-label="Enviar mensagem" disabled>Enviar</button>
        </div>

        <p id="chat-erro" class="chat-erro" role="alert" hidden></p>
    </form>
