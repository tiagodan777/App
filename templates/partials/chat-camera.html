<dialog id="chat-camera" class="chat-camera" aria-label="Câmara">
    <video data-camera-live autoplay muted playsinline></video>
    <video data-camera-playback controls playsinline hidden></video>
    <img alt="Fotografia captada" hidden>

    <button
        type="button"
        data-camera="close"
        class="chat-camera-close"
        aria-label="Fechar câmara"
    >×</button>

    <div
        class="chat-camera-mode"
        data-camera-mode
        hidden
        aria-label="Disponibilidade da fotografia"
    >
        <button type="button" data-once="false" aria-pressed="true">Manter</button>
        <button type="button" data-once="true" aria-pressed="false">Ver uma vez</button>
    </div>

    <output class="chat-camera-status" data-camera-status aria-live="off"></output>

    <div class="chat-camera-controls">
        <button type="button" data-camera="gallery">Galeria</button>
        <button type="button" data-camera="retake" hidden>Repetir</button>
        <button
            type="button"
            data-camera="capture"
            class="chat-shutter"
            aria-label="Tirar fotografia; manter premido para vídeo"
            disabled
        ></button>
        <button type="button" data-camera="use" hidden>Usar fotografia</button>
        <button type="button" data-camera="flip" aria-label="Trocar câmara">↻</button>
    </div>
</dialog>
