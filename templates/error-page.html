<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>{{ page_title|default('Página não encontrada') }} | Margot</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            background: #fff;
            color: #111;
            font-family: Helvetica, Arial, sans-serif;
        }

        main {
            width: min(100%, 480px);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 7vw, 42px);
        }

        p {
            margin: 0 0 24px;
            color: #666;
            font-size: 17px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 999px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main>
        <h1>{{ heading|default('Página não encontrada') }}</h1>

        <p>
            {{ message|default(
                'Esta página não existe ou já não está disponível.'
            ) }}
        </p>

        <a href="{{ doc_root }}index">Voltar ao início</a>
    </main>
</body>
</html>
