{% extends 'layout.html' %}

{% block styles %}
<link rel="stylesheet" href="{{ doc_root }}estilos/create-account.css?v=10">
<link rel="stylesheet" href="{{ doc_root }}estilos/create-account-permissoes.css?v=1">
{% endblock %}

{% block content %}
<form action="{{ doc_root }}create-account" method="post" enctype="multipart/form-data" id="create-account-form"></form>

<script nonce="{{ csp_nonce }}">
window.createAccountConfig = {
    modoEdicao: {{ modo_edicao|json_encode(json_script_flags)|raw }},
    membroId: {{ membro_id_edicao|json_encode(json_script_flags)|raw }},
    dadosIniciais: {{ dados_iniciais|json_encode(json_script_flags)|raw }},
    fotosExistentes: {{ fotos_existentes|json_encode(json_script_flags)|raw }},
    camposUrl: {{ campos_url|json_encode(json_script_flags)|raw }},
    perfilUrl: {{ perfil_url|json_encode(json_script_flags)|raw }},
    csrfToken: {{ csrf_token|json_encode(json_script_flags)|raw }}
};
</script>

<script src="{{ doc_root }}js/preferencias.js?v=4"></script>
<script src="{{ doc_root }}js/create-account-fotos.js?v=5"></script>
<script src="{{ doc_root }}js/create-account-permissoes.js?v=3"></script>
<script src="{{ doc_root }}js/create-account-navegacao.js?v=7"></script>
<script src="{{ doc_root }}js/create-account-autocompletar.js?v=3"></script>
{% endblock %}
