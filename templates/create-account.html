{% extends 'layout.html' %}

{% block title %}
    {{ modo_edicao|default(false) ? 'Editar perfil' : 'Criar conta' }} | Margot
{% endblock %}

{% block styles %}
<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account.css?v=12"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account-permissoes.css?v=2"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account-editor.css?v=2"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account-legal.css?v=2"
    data-margot-page-style
>
{% endblock %}

{% block content %}
<form
    action="{{ doc_root }}create-account"
    method="post"
    enctype="multipart/form-data"
    id="create-account-form"
    novalidate
>
    <input
        type="hidden"
        name="_csrf"
        value="{{ csrf_token|e('html_attr') }}"
    >
</form>

{#
    As etapas ficam carregadas juntamente com a própria página.

    <template> é inerte:
    - não aparece no ecrã;
    - os inputs não pertencem ao formulário;
    - os required não interferem com validação;
    - não existem pedidos AJAX adicionais para começar o registo.

    create-account-navegacao.js retira daqui apenas a etapa
    necessária antes do primeiro paint.
#}

<template id="create-account-campos-cache">
    {% include 'create-account-campos.html' %}
</template>

<script>
window.createAccountConfig = {
    modoEdicao:
        {{ modo_edicao|default(false)|json_encode(15)|raw }},

    membroId:
        {{ membro_id_edicao|default('')|json_encode(15)|raw }},

    dadosIniciais:
        {{ dados_iniciais|default({})|json_encode(15)|raw }},

    fotosExistentes:
        {{ fotos_existentes|default([])|json_encode(15)|raw }},

    camposUrl:
        {{ campos_url|default(doc_root ~ 'create-account-campos')|json_encode(15)|raw }},

    perfilUrl:
        {{ perfil_url|default('')|json_encode(15)|raw }},

    csrfToken:
        {{ csrf_token|default('')|json_encode(15)|raw }}
};
</script>

<script src="{{ doc_root }}js/preferencias.js?v=2"></script>
<script src="{{ doc_root }}js/create-account-fotos.js?v=7"></script>
<script src="{{ doc_root }}js/create-account-permissoes.js?v=5"></script>
<script src="{{ doc_root }}js/create-account-navegacao.js?v=15"></script>
<script src="{{ doc_root }}js/create-account-autocompletar.js?v=4"></script>
{% endblock %}
