{% extends 'layout.html' %}

{% block title %}
    {{ modo_edicao|default(false) ? 'Editar perfil' : 'Criar conta' }} | Margot
{% endblock %}

{% block styles %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account.css?v=20260916"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account-permissoes.css?v=20260916"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account-editor.css?v=20260923"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/create-account-legal.css?v=20260916"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/invitation-entry.css?v=20260927-auth2"
    data-margot-page-style
>

<link
    rel="stylesheet"
    href="{{ doc_root }}estilos/auth-motion.css?v=20260929-auth3"
    data-margot-page-style
>

<link
    rel="preload"
    href="{{ doc_root }}estilos/login.css?v=20260916"
    as="style"
    fetchpriority="low"
>

<link
    rel="preload"
    href="{{ doc_root }}js/login.js?v=20260916"
    as="script"
    fetchpriority="low"
>

<link rel="prefetch" href="{{ doc_root }}login">
{% endblock %}

{% block content %}
<form
    action="{{ doc_root }}create-account{{ convite_ativo|default('') ? '?convite=' ~ convite_ativo : '' }}"
    method="post"
    enctype="multipart/form-data"
    id="create-account-form"
    {% if not modo_edicao|default(false) %}data-onboarding{% endif %}
    novalidate
>
    <input
        type="hidden"
        name="_csrf"
        value="{{ csrf_token|e('html_attr') }}"
    >

    {% if not modo_edicao|default(false) %}
        {% include 'account/introducao.html' %}
    {% endif %}
</form>

<template id="create-account-campos-cache">
    {% include 'create-account-campos.html' %}
</template>

<script>
window.createAccountConfig = {
    modoEdicao:
        {{ modo_edicao|default(false)|json_encode(15)|raw }},

    membroId:
        {{ membro_id_edicao|default('')|json_encode(15)|raw }},

    dadosIniciais:
        {{ dados_iniciais|default({})|json_encode(15)|raw }},

    fotosExistentes:
        {{ fotos_existentes|default([])|json_encode(15)|raw }},

    camposUrl:
        {{ campos_url|default(doc_root ~ 'create-account-campos')|json_encode(15)|raw }},

    perfilUrl:
        {{ perfil_url|default('')|json_encode(15)|raw }},

    csrfToken:
        {{ csrf_token|default('')|json_encode(15)|raw }}
};
</script>

<script src="{{ doc_root }}js/preferencias.js?v=20260916"></script>
<script src="{{ doc_root }}js/create-account-fotos.js?v=20260916"></script>
<script src="{{ doc_root }}js/create-account-permissoes.js?v=20260929-1"></script>
<script src="{{ doc_root }}js/create-account-navegacao.js?v=20260929-1"></script>
<script src="{{ doc_root }}js/create-account-autocompletar.js?v=20260916"></script>
{% endblock %}
