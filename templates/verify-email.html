<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Confirmar email | Margot</title>
    <link rel="stylesheet" href="{{ doc_root }}estilos/style.css">
    <link rel="stylesheet" href="{{ doc_root }}estilos/login.css">
</head>
<body>
    <main>
        <form>
            <h1>Confirmar email</h1>
            {% if verificado %}
                <p class="login-mensagem login-mensagem-sucesso" role="status" aria-live="polite">
                    O teu email foi confirmado. Já podes entrar na Margot.
                </p>
            {% else %}
                <p class="login-mensagem login-mensagem-erro" role="alert">
                    {{ mensagem_erro|default('Esta ligação é inválida, expirou ou já foi utilizada.')|e }}
                </p>
            {% endif %}
        </form>
    </main>
    <aside>
        {% if verificado %}
            <a href="{{ doc_root }}login" id="esqueci-palavra-passe">Entrar na Margot</a>
        {% else %}
            <a href="{{ doc_root }}email-verification-resend" id="esqueci-palavra-passe">Pedir uma nova ligação</a>
        {% endif %}
    </aside>
</body>
</html>
